<div class="toast-container" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toasts(); track trackById($index, toast)) {
    <div class="toast toast-{{ toast.type }}" [class.removing]="toast.removing" role="alert">
      <div class="toast-icon">{{ getIcon(toast.type) }}</div>
      <div class="toast-content">
        <div class="toast-title">{{ toast.title }}</div>
        @if (toast.message) {
          <div class="toast-message">{{ toast.message }}</div>
        }
      </div>
      <button class="toast-close" (click)="dismiss(toast.id)" aria-label="Dismiss">✕</button>
    </div>
  }
</div>
